{% extends "base.html" %}

{% block title %}Entrar{% endblock %}

{% block conteudo %}
  <h1>Entrar</h1>

  <form method="post">
    {% csrf_token %}

    {% if form.non_field_errors %}
      <div role="alert">
        {% for erro in form.non_field_errors %}<p>{{ erro }}</p>{% endfor %}
      </div>
    {% endif %}

    {% for campo in form %}
      {{ campo.as_field_group }}
    {% endfor %}

    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>
{% endblock %}
